<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gossip</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>
<div id="intro">
    <div class="intro-content">
        <p>SPOTTED.</p>
        <h1>GOSSIP</h1>
        <span>You heard it here first.</span>
    </div>
</div>
    <header>
        <h1>GOSSIP</h1>
        <p>Spotted. Heard. Revealed.</p>
    </header>
<section class="publisher">
    <h2>NEW GOSSIP</h2>

    <input id="gossipTitle" type="text" placeholder="Title...">

    <select id="gossipCategory">
        <option value="GOSSIP">GOSSIP</option>
        <option value="SPOTTED">SPOTTED</option>
        <option value="RUMOR">RUMOR</option>
        <option value="PLOT TWIST">PLOT TWIST</option>
    </select>

    <textarea id="gossipText" placeholder="Tell us everything..."></textarea>

    <button id="publishBtn">PUBLISH</button>
</section>
    <main>

       <h2>LATEST GOSSIP</h2>

<div id="gossipFeed"></div>

        <article class="gossip">
            <span class="category">SPOTTED</span>

            <h3>Someone has a secret...</h3>

            <p>
                Something happened today, and apparently
                everyone is already talking about it.
            </p>

            <small>22 September • 21:45</small>
        </article>

    </main>

    <script src="script.js"></script>

</body>
</html>
